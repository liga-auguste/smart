envVarGroups:
  - name: smart-shared
    envVars:
      - key: SECRET_KEY
        generateValue: true

services:
  - type: web
    name: smart
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVarGroups:
      - smart-shared
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartshit
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.13.0

  - type: cron
    name: reset-demo-data
    runtime: python
    schedule: "0 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: SECRET_KEY=placeholder python manage.py create_demo_data
    envVarGroups:
      - smart-shared
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartshit
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.13.0
