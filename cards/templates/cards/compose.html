{% extends 'cards/base.html' %}
{% load static %}

{% block title %}compose — smart{% endblock %}

{% block content %}
<div class="compose-wrap">
  <form method="post" class="compose-form" id="compose-form">
    {% csrf_token %}

    <input
      type="text"
      name="headline"
      id="compose-headline"
      class="compose-headline"
      placeholder="überschrift"
      autocomplete="off"
      spellcheck="false"
      autofocus
      value="{{ shared }}"
    >
    <textarea
      name="body"
      id="compose-body"
      class="compose-body"
      placeholder="text"
      spellcheck="false"
    ></textarea>

    <input type="hidden" name="stapel" id="compose-stapel-value" value="{{ preset_stapel }}">
    <input
      type="text"
      id="compose-stapel"
      class="compose-stapel"
      placeholder="stapel"
      autocomplete="off"
      spellcheck="false"
    >
    {% if stapel_suggestions %}
    <div class="compose-stapel-chips" id="compose-stapel-chips" hidden>
      {% for s in stapel_suggestions %}
      <button type="button" class="compose-stapel-chip" data-value="{{ s }}">{{ s }}</button>
      {% endfor %}
    </div>
    {% endif %}

    <div class="compose-actions">
      <button type="submit" class="btn-save">speichern</button>
    </div>
  </form>

  <div class="save-confirm" id="save-confirm"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/compose.js' %}"></script>
{% endblock %}
