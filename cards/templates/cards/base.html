<!DOCTYPE html>
<html lang="de" data-theme="nacht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}smart{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/themes.css' %}">
</head>
<body>
  <nav class="nav">
    {% if user.is_authenticated %}
      <a href="{% url 'compose' %}" class="nav-link">compose</a>
      <a href="{% url 'list' %}" class="nav-link">cards</a>
      <a href="{% url 'logout' %}" class="nav-link nav-logout">raus</a>
    {% endif %}
  </nav>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'js/theme.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
